    (click)="toggleProfile()"

<router-outlet></router-outlet>

<!-- ✅ PROFILE MODAL -->
<!-- PROFILE MODAL -->
<div
  class="profile-overlay"
  *ngIf="IsLoggin && showProfile"
>
  <div class="profile-card">
    <h5 class="mb-3">Edit Profile</h5>

    <label class="form-label">Username</label>
    <input
      type="text"
      class="form-control mb-3"
      [(ngModel)]="username"
    />

    <div class="d-flex gap-2">
      <button class="btn btn-primary w-100" (click)="updateUsername()">
        Save
      </button>
      <button class="btn btn-secondary w-100" (click)="toggleProfile()">
        Cancel
      </button>
    </div>
  </div>
</div>

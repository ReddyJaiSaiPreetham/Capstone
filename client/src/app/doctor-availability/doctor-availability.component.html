
<nav class="navbar">
  <div class="navbar-left">
    <span class="brand">HAM System</span>
    <a routerLink="/doctor-appointment" class="nav-link">
      Doctor Appointment
    </a>
    <a routerLink="/doctor-availability" class="nav-link active">
      Doctor Availability
    </a>
  </div>

  <div class="navbar-right">
    <a routerLink="/login" class="nav-link logout">Logout</a>
  </div>
</nav>

<div class="container">
  <h3>Update Availability</h3>
  <div *ngIf="isAdded" class="alert alert-success">
    {{ responseMessage }}
  </div>

  <form [formGroup]="itemForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label>Availability</label>
      <select formControlName="availability">
        <option value="">Select</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
    </div>

    <button type="submit" [disabled]="itemForm.invalid">
      Update
    </button>

  </form>
</div>

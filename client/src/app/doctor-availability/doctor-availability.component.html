
<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand">Healthcare Appointment System</span>

  <div>
    <a class="btn btn-outline-light me-2" routerLink="/doctor-appointment">
      Appointments
    </a>
    <a class="btn btn-outline-light me-2" routerLink="/doctor-availability">
      Availability
    </a>
    <a class="btn btn-danger" routerLink="/login">Logout</a>
  </div>
</nav>

<!-- Main Container -->
<div class="container mt-5">

  <div class="card col-md-6 mx-auto shadow">
    
    <div class="card-header bg-primary text-white text-center">
      <h5 class="mb-0">Update Availability</h5>
    </div>

    <div class="card-body">

      <form [formGroup]="itemForm" (ngSubmit)="onSubmit()">

        <!-- Availability Dropdown -->
        <div class="mb-3">
          <label class="form-label">Availability</label>

          <select class="form-control" formControlName="availability">
            <option value="">-- Select Availability --</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>

          <!-- Validation Message -->
          <small
            class="text-danger"
            *ngIf="itemForm.controls['availability'].invalid && itemForm.controls['availability'].touched"
          >
            Availability is required
          </small>
        </div>

        <!-- Submit Button -->
        <div class="text-center">
          <button
            type="submit"
            class="btn btn-success px-4"
            [disabled]="itemForm.invalid"
          >
            Update
          </button>
        </div>

      </form>

      <!-- Success Message -->
      <div *ngIf="isAdded" class="alert alert-success mt-3 text-center">
        {{ responseMessage }}
      </div>

    </div>
  </div>

</div>

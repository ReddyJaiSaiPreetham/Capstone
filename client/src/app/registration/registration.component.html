<div class="container mt-5">

  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="card shadow p-4">

        <!-- Title -->
        <h3 class="text-center mb-3">
          Healthcare Appointment Management System
        </h3>

        <p class="text-center text-muted">
          Please enter your registration details
        </p>

        <!-- Form -->
        <form [formGroup]="itemForm" (ngSubmit)="onRegister()">

          <!-- USERNAME -->
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input
              type="text"
              class="form-control"
              formControlName="username"
            />
            <small class="text-danger"
              *ngIf="itemForm.get('username')?.touched && itemForm.get('username')?.invalid">
              Username is required
            </small>
          </div>

          <!-- EMAIL -->
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              formControlName="email"
            />
            <small class="text-danger"
              *ngIf="itemForm.get('email')?.touched && itemForm.get('email')?.invalid">
              Valid email is required
            </small>
          </div>

          <!-- PASSWORD -->
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              formControlName="password"
            />
            <small class="text-danger"
              *ngIf="itemForm.get('password')?.touched && itemForm.get('password')?.invalid">
              Password is required
            </small>
          </div>

          <!-- ROLE -->
          <div class="mb-3">
            <label class="form-label">Role</label>
            <select class="form-control" formControlName="role">
              <option value="">Select Role</option>
              <option value="PATIENT">PATIENT</option>
              <option value="DOCTOR">DOCTOR</option>
              <option value="RECEPTIONIST">RECEPTIONIST</option>
            </select>
            <small class="text-danger"
              *ngIf="itemForm.get('role')?.touched && itemForm.get('role')?.invalid">
              Role is required
            </small>
          </div>

          <!-- DOCTOR SPECIFIC FIELDS -->
          <div *ngIf="itemForm.get('role')?.value === 'DOCTOR'">

            <!-- Specialty -->
            <div class="mb-3">
              <label class="form-label">Specialty</label>
              <input
                type="text"
                class="form-control"
                formControlName="specialty"
              />
              <small class="text-danger"
                *ngIf="itemForm.get('specialty')?.touched && itemForm.get('specialty')?.invalid">
                Specialty is required for doctor
              </small>
            </div>

            <!-- Availability -->
            <div class="mb-3">
              <label class="form-label">Availability</label>

              <select class="form-control" formControlName="availability">
                <option value="">Select Availability</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>

              <small class="text-danger"
                *ngIf="itemForm.get('availability')?.touched && itemForm.get('availability')?.invalid">
                Availability is required for doctor
              </small>
            </div>

          </div>

          <!-- SUBMIT BUTTON -->
          <div class="d-grid mt-4">
            <button class="btn btn-dark" type="submit">
              Register
            </button>
          </div>

        </form>

        <!-- SUCCESS MESSAGE -->
        <div class="alert alert-success mt-3 text-center" *ngIf="showMessage">
          {{ responseMessage }}
        </div>

        <!-- LOGIN LINK -->
        <div class="text-center mt-3">
          <a routerLink="/login">Already have an account? Login</a>
        </div>

      </div>

    </div>
  </div>

</div>

<div class="login-page">
  <div class="login-overlay"></div>

  <div class="login-wrapper">
    <div class="login-form login-form--scroll">

      <h3 class="text-center mb-2">
        HEALTHCARE APPOINTMENT
        <br />
        MANAGEMENT SYSTEM
      </h3>

      <p class="text-center subtitle">
        Please enter your registration details
      </p>

      <form [formGroup]="itemForm" (ngSubmit)="onRegister()">

        <!-- Username -->
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input class="form-control"
                 type="text"
                 formControlName="username"
                 placeholder="Enter username">
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control"
                 type="email"
                 formControlName="email"
                 placeholder="Enter email">
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input class="form-control"
                 type="password"
                 formControlName="password"
                 placeholder="Enter password">
        </div>

        <!-- Role -->
        <div class="mb-3">
          <label class="form-label">Role</label>
          <select class="form-control" formControlName="role">
            <option value="">Select Role</option>
            <option value="PATIENT">PATIENT</option>
            <option value="DOCTOR">DOCTOR</option>
            <option value="RECEPTIONIST">RECEPTIONIST</option>
          </select>
        </div>

        <!-- Doctor fields -->
        <div *ngIf="itemForm.get('role')?.value === 'DOCTOR'">
          <div class="mb-3">
            <label class="form-label">Specialty</label>
            <input class="form-control"
                   type="text"
                   formControlName="specialty">
          </div>

          <div class="mb-3">
            <label class="form-label">Availability</label>
            <select class="form-control"
                    formControlName="availability">
              <option value="">-- Select Availability --</option>
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
          </div>
        </div>

        <button class="btn login-btn w-100 mt-3" type="submit">
          REGISTER
        </button>
      </form>

      <div class="alert alert-success mt-3" *ngIf="showMessage">
        {{ responseMessage }}
      </div>

      <div class="text-center mt-3 register-link">
        Already have an account?
        <a routerLink="/login">Login</a>
      </div>

    </div>
  </div>
</div>
